name: Build EuroTune

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target EuroTune_VST3 --parallel

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\EuroTune.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: EuroTune-Windows-Installer
          path: installer/windows/Output/EuroTune-Setup-Windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: EuroTune-Windows-VST3-raw
          path: build/EuroTune_artefacts/Release/VST3/EuroTune.vst3

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/windows/Output/EuroTune-Setup-Windows.exe
